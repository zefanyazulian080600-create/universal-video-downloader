services:
  - type: worker
    name: linkgrabber-telegram-bot
    env: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/bot.db
      - key: LOG_LEVEL
        value: INFO
      - key: TEMP_DIR
        value: ./downloads
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: MAX_DOWNLOAD_MB
        value: "200"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "3"
      - key: MAX_JOBS_PER_USER
        value: "2"
      - key: ENABLE_FFMPEG
        value: "true"
